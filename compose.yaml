# =====================================================================
# 萌宠诊所 · 宠物医院管理系统 —— 微服务一键启动编排（第 07 周 · 接入 Nacos）
#
# 用法：
#   cp .env.example .env           # 第一次使用，复制配置模板
#   docker compose up -d --build   # 构建并启动 mysql + 三个微服务
#   docker compose ps              # 查看状态
#   docker compose logs -f appointment-service
#   docker compose down            # 停止并删除容器（保留数据卷）
#   bash scripts/smoke-test.sh     # 一键验证（从仓库根目录运行）
#
# 第 07 周新增：
#   - Nacos 单机模式（含鉴权与数据卷），控制台 18080、服务端 8848、SDK 9848
#   - 业务服务通过服务名注册到 Nacos（分组 PERSONAL_GROUP），跨服务调用改为服务发现
#   - 首次启动后需初始化 Nacos 管理员密码，命令见 README「七、接入 Nacos」
#
# 说明：
#   - 不使用已废弃的 version 字段（Compose V2 规范）
#   - 三个微服务各自独立构建上下文 services/<服务名>/
#   - 三个独立 MySQL 实例（Database per Service）：每个服务独占一个
#     MySQL 容器 + 一个库 + 一个账号，实例级隔离，见下方 mysql-* 三个服务
#   - 服务间通过 Compose 服务名通信（pet-service / doctor-service），
#     不使用 localhost 访问其他容器
#   - 第 05 周的单体工程保留在 monolith/，不再参与本周编排
# =====================================================================

name: petclinic

services:

  # -------------------------------------------------------------------
  # Nacos 3.2.4：服务注册与发现中心（单机模式 + 鉴权 + 数据卷）
  #   - 控制台 容器 8080 → 宿主机 ${NACOS_CONSOLE_PORT:-18080}
  #   - 服务端 HTTP 8848（SDK 与 HTTP API 注册/发现都走这里）
  #   - SDK gRPC 9848（客户端长连接端口，缺了会注册失败）
  #   - 鉴权三要素（Token / identity key / identity value）全部来自 .env
  # -------------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: petclinic-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_ADMIN_ENABLE: "true"
      NACOS_AUTH_CONSOLE_ENABLE: "true"
      NACOS_AUTH_SYSTEM_TYPE: nacos
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 512m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    ports:
      - "${NACOS_CONSOLE_PORT:-18080}:8080"   # 控制台（浏览器访问）
      - "${NACOS_SERVER_PORT:-8848}:8848"     # 服务端 HTTP（注册/发现/OpenAPI）
      - "${NACOS_SDK_PORT:-9848}:9848"        # SDK gRPC 长连接（客户端注册必需）
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - petclinic-net
    healthcheck:
      # Nacos 官方镜像不含 curl，这里用 bash 的 /dev/tcp 探测 API 端口是否已监听
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8848' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # -------------------------------------------------------------------
  # 数据库：MySQL 8.4.11 × 3 —— 每个微服务一个独立实例（Database per Service）
  #
  #   - mysql-pet          → petclinic_pet           （pet-service 独占）
  #   - mysql-doctor       → petclinic_doctor        （doctor-service 独占）
  #   - mysql-appointment  → petclinic_appointment   （appointment-service 独占）
  #
  #   每个实例只有一个库、一个业务账号（由官方镜像的 MYSQL_DATABASE /
  #   MYSQL_USER / MYSQL_PASSWORD 自动创建并授权），隔离从「同实例拆库」
  #   升级为「实例级隔离」：任何一个 MySQL 进程挂掉，只影响一个服务。
  #   宿主机端口 3307 / 3308 / 3309（3306 被课程容器占用）。
  #   三个实例都调低 buffer pool 并关掉 performance_schema，8 GB 机器跑得动。
  # -------------------------------------------------------------------
  mysql-pet:
    image: mysql:8.4.11
    container_name: petclinic-mysql-pet
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: petclinic_pet
      MYSQL_USER: ${PET_DB_USER}
      MYSQL_PASSWORD: ${PET_DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --max-connections=50
    ports:
      - "${MYSQL_PET_PORT:-3307}:3306"
    volumes:
      - mysql-pet-data:/var/lib/mysql
    networks:
      - petclinic-net
    healthcheck:
      # 密码用 $$ 转义，避免被 Compose 先做变量替换，实际由容器内 shell 展开
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-doctor:
    image: mysql:8.4.11
    container_name: petclinic-mysql-doctor
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: petclinic_doctor
      MYSQL_USER: ${DOCTOR_DB_USER}
      MYSQL_PASSWORD: ${DOCTOR_DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --max-connections=50
    ports:
      - "${MYSQL_DOCTOR_PORT:-3308}:3306"
    volumes:
      - mysql-doctor-data:/var/lib/mysql
    networks:
      - petclinic-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-appointment:
    image: mysql:8.4.11
    container_name: petclinic-mysql-appointment
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: petclinic_appointment
      MYSQL_USER: ${APPOINTMENT_DB_USER}
      MYSQL_PASSWORD: ${APPOINTMENT_DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --max-connections=50
    ports:
      - "${MYSQL_APPOINTMENT_PORT:-3309}:3306"
    volumes:
      - mysql-appointment-data:/var/lib/mysql
    networks:
      - petclinic-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------------------
  # pet-service：宠物档案（宿主机 8081）
  # -------------------------------------------------------------------
  pet-service:
    build:
      context: ./services/pet-service
      dockerfile: Dockerfile
    image: petclinic-pet-service:week09
    container_name: petclinic-pet-service
    restart: unless-stopped
    depends_on:
      mysql-pet:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test,docker   # test 环境 = test 配置组 + docker 容器参数
      DB_USERNAME: ${PET_DB_USER}
      DB_PASSWORD: ${PET_DB_PASSWORD}
      DB_URL: jdbc:mysql://mysql-pet:3306/petclinic_pet?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-PERSONAL_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_REGISTER_ENABLED: "true"
      # 第 10 周：配置中心分组（test 环境），Data ID = 服务名.yaml
      PETCLINIC_CONFIG_GROUP: PETCLINIC_TEST
      # ---- 第 09 周：认证与网关信任 ----
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-petclinic-auth}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      APP_SEED_PASSWORD: ${APP_SEED_PASSWORD}
      TRUSTED_CALLER_SECRET: ${TRUSTED_CALLER_SECRET}
      GATEWAY_TRUST_ENABLED: "true"
      TZ: Asia/Shanghai
    ports:
      # 只绑 127.0.0.1：宿主机本机可以直连（用于验证「直连被拒」），
      # 局域网/外网访问不到，唯一对外入口是 gateway-service 的 8080
      - "127.0.0.1:${PET_PORT:-8084}:8080"
    networks:
      - petclinic-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  # -------------------------------------------------------------------
  # doctor-service：医生主数据（宿主机 8082）
  # -------------------------------------------------------------------
  doctor-service:
    build:
      context: ./services/doctor-service
      dockerfile: Dockerfile
    image: petclinic-doctor-service:week09
    container_name: petclinic-doctor-service
    restart: unless-stopped
    depends_on:
      mysql-doctor:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test,docker   # test 环境 = test 配置组 + docker 容器参数
      DB_USERNAME: ${DOCTOR_DB_USER}
      DB_PASSWORD: ${DOCTOR_DB_PASSWORD}
      DB_URL: jdbc:mysql://mysql-doctor:3306/petclinic_doctor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-PERSONAL_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_REGISTER_ENABLED: "true"
      # 第 10 周：配置中心分组（test 环境），Data ID = 服务名.yaml
      PETCLINIC_CONFIG_GROUP: PETCLINIC_TEST
      TZ: Asia/Shanghai
    ports:
      # 仅供本机调试；对外只允许走 gateway
      - "127.0.0.1:${DOCTOR_PORT:-8082}:8080"
    networks:
      - petclinic-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  # -------------------------------------------------------------------
  # appointment-service：预约流程（宿主机 8083）
  # 通过服务名访问 pet-service / doctor-service（不用 localhost）
  # -------------------------------------------------------------------
  appointment-service:
    build:
      context: ./services/appointment-service
      dockerfile: Dockerfile
    image: petclinic-appointment-service:week09
    container_name: petclinic-appointment-service
    restart: unless-stopped
    depends_on:
      mysql-appointment:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test,docker   # test 环境 = test 配置组 + docker 容器参数
      DB_USERNAME: ${APPOINTMENT_DB_USER}
      DB_PASSWORD: ${APPOINTMENT_DB_PASSWORD}
      DB_URL: jdbc:mysql://mysql-appointment:3306/petclinic_appointment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-PERSONAL_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_REGISTER_ENABLED: "true"
      # 第 10 周：配置中心分组（test 环境），Data ID = 服务名.yaml
      PETCLINIC_CONFIG_GROUP: PETCLINIC_TEST
      # 注意：已删除 PET_SERVICE_URL / DOCTOR_SERVICE_URL，
      # 跨服务地址改由 Nacos 服务名 + 实例发现决定，不再使用 compose 固定 DNS
      # 第 09 周：跨服务调用要带上与网关相同的可信凭证，
      # 否则 pet-service 的信任过滤器会把 Feign 调用当成「绕过网关的直连」拒掉
      TRUSTED_CALLER_SECRET: ${TRUSTED_CALLER_SECRET}
      TZ: Asia/Shanghai
    ports:
      # 仅供本机调试；对外只允许走 gateway
      - "127.0.0.1:${APPOINTMENT_PORT:-8083}:8080"
    networks:
      - petclinic-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  # -------------------------------------------------------------------
  # gateway-service：API Gateway（第 09 周新增）
  #
  #   - 唯一对外发布端口（0.0.0.0:8080），客户端只知道这一个地址
  #   - 4 条路由的目标都写服务名（lb://pet-service 等），实例由 Nacos 提供
  #   - 全局过滤器校验 JWT：未登录 401、越权 403，请求不会传到下游
  #   - 校验通过后剥掉客户端伪造的身份头，再注入 X-Auth-* 与 X-Trusted-Caller
  #
  #   注意：本服务不能依赖 spring-boot-starter-web，
  #         必须运行在 REACTIVE 模式，否则路由不会装配（见 Dockerfile 注释）
  # -------------------------------------------------------------------
  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    image: petclinic-gateway-service:week09
    container_name: petclinic-gateway
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test,docker   # test 环境 = test 配置组 + docker 容器参数
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-PERSONAL_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_REGISTER_ENABLED: "true"
      # 第 10 周：配置中心分组（test 环境），Data ID = 服务名.yaml
      PETCLINIC_CONFIG_GROUP: PETCLINIC_TEST
      # 必须与 pet-service 的 JWT_SECRET 完全一致，否则验签全失败
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-petclinic-auth}
      TRUSTED_CALLER_SECRET: ${TRUSTED_CALLER_SECRET}
      TZ: Asia/Shanghai
    ports:
      # 唯一对外端口：其他服务都只绑 127.0.0.1
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - petclinic-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

# ---------------------------------------------------------------------
# 共享网络：所有容器加入同一 bridge 网络，
# 服务名 pet-service / doctor-service / mysql 由 Compose 内建 DNS 解析
# ---------------------------------------------------------------------
networks:
  petclinic-net:
    driver: bridge

# ---------------------------------------------------------------------
# 命名数据卷：三个 MySQL 实例的数据落盘位置（容器删除重建数据不丢）
# 注意：petclinic-ms-mysql-data 是拆分前单实例的旧卷，保留在本机不删；
#       第 05 周单体的旧卷 petclinic-mysql-data 也仍在，互不影响
# ---------------------------------------------------------------------
volumes:
  mysql-pet-data:
    name: petclinic-ms-mysql-pet-data
  mysql-doctor-data:
    name: petclinic-ms-mysql-doctor-data
  mysql-appointment-data:
    name: petclinic-ms-mysql-appointment-data
  # Nacos 单机模式的数据（Derby + 注册信息）与日志，容器重建后注册配置不丢
  nacos-data:
    name: petclinic-nacos-data
  nacos-logs:
    name: petclinic-nacos-logs
