# =====================================================================
# 萌宠诊所 · 宠物医院管理系统 —— 微服务一键启动编排（第 07 周 · 接入 Nacos）
#
# 用法：
#   cp .env.example .env           # 第一次使用，复制配置模板
#   docker compose up -d --build   # 构建并启动 mysql + 三个微服务
#   docker compose ps              # 查看状态
#   docker compose logs -f appointment-service
#   docker compose down            # 停止并删除容器（保留数据卷）
#   bash scripts/smoke-test.sh     # 一键验证（从仓库根目录运行）
#
# 第 07 周新增：
#   - Nacos 单机模式（含鉴权与数据卷），控制台 18080、服务端 8848、SDK 9848
#   - 业务服务通过服务名注册到 Nacos（分组 PERSONAL_GROUP），跨服务调用改为服务发现
#   - 首次启动后需初始化 Nacos 管理员密码，命令见 README「七、接入 Nacos」
#
# 说明：
#   - 不使用已废弃的 version 字段（Compose V2 规范）
#   - 三个微服务各自独立构建上下文 services/<服务名>/
#   - 同一个 MySQL 实例内建三个独立数据库 + 三个独立账号（见 docker/mysql-init/），
#     任何服务都只能读写自己的库，禁止跨服务访问数据表
#   - 服务间通过 Compose 服务名通信（pet-service / doctor-service），
#     不使用 localhost 访问其他容器
#   - 第 05 周的单体工程保留在 monolith/，不再参与本周编排
# =====================================================================

name: petclinic

services:

  # -------------------------------------------------------------------
  # Nacos 3.2.4：服务注册与发现中心（单机模式 + 鉴权 + 数据卷）
  #   - 控制台 容器 8080 → 宿主机 ${NACOS_CONSOLE_PORT:-18080}
  #   - 服务端 HTTP 8848（SDK 与 HTTP API 注册/发现都走这里）
  #   - SDK gRPC 9848（客户端长连接端口，缺了会注册失败）
  #   - 鉴权三要素（Token / identity key / identity value）全部来自 .env
  # -------------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: petclinic-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_ADMIN_ENABLE: "true"
      NACOS_AUTH_CONSOLE_ENABLE: "true"
      NACOS_AUTH_SYSTEM_TYPE: nacos
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 512m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    ports:
      - "${NACOS_CONSOLE_PORT:-18080}:8080"   # 控制台（浏览器访问）
      - "${NACOS_SERVER_PORT:-8848}:8848"     # 服务端 HTTP（注册/发现/OpenAPI）
      - "${NACOS_SDK_PORT:-9848}:9848"        # SDK gRPC 长连接（客户端注册必需）
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - petclinic-net
    healthcheck:
      # Nacos 官方镜像不含 curl，这里用 bash 的 /dev/tcp 探测 API 端口是否已监听
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8848' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # -------------------------------------------------------------------
  # 数据库：MySQL 8.4.11 单实例，初始化脚本建立三库三账号
  # -------------------------------------------------------------------
  mysql:
    image: mysql:8.4.11
    container_name: petclinic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 初始化脚本（docker/mysql-init/01-init-databases.sh）读取这三个变量建库建账号
      PET_DB_PASSWORD: ${PET_DB_PASSWORD}
      DOCTOR_DB_PASSWORD: ${DOCTOR_DB_PASSWORD}
      APPOINTMENT_DB_PASSWORD: ${APPOINTMENT_DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - petclinic-net
    healthcheck:
      # 密码用 $$ 转义，避免被 Compose 先做变量替换，实际由容器内 shell 展开
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------------------
  # pet-service：宠物档案（宿主机 8081）
  # -------------------------------------------------------------------
  pet-service:
    build:
      context: ./services/pet-service
      dockerfile: Dockerfile
    image: petclinic-pet-service:week07
    container_name: petclinic-pet-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${PET_DB_USER}
      DB_PASSWORD: ${PET_DB_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-PERSONAL_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_REGISTER_ENABLED: "true"
      TZ: Asia/Shanghai
    ports:
      - "${PET_PORT:-8081}:8080"
    networks:
      - petclinic-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  # -------------------------------------------------------------------
  # doctor-service：医生主数据（宿主机 8082）
  # -------------------------------------------------------------------
  doctor-service:
    build:
      context: ./services/doctor-service
      dockerfile: Dockerfile
    image: petclinic-doctor-service:week07
    container_name: petclinic-doctor-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DOCTOR_DB_USER}
      DB_PASSWORD: ${DOCTOR_DB_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-PERSONAL_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_REGISTER_ENABLED: "true"
      TZ: Asia/Shanghai
    ports:
      - "${DOCTOR_PORT:-8082}:8080"
    networks:
      - petclinic-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  # -------------------------------------------------------------------
  # appointment-service：预约流程（宿主机 8083）
  # 通过服务名访问 pet-service / doctor-service（不用 localhost）
  # -------------------------------------------------------------------
  appointment-service:
    build:
      context: ./services/appointment-service
      dockerfile: Dockerfile
    image: petclinic-appointment-service:week07
    container_name: petclinic-appointment-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${APPOINTMENT_DB_USER}
      DB_PASSWORD: ${APPOINTMENT_DB_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-PERSONAL_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_REGISTER_ENABLED: "true"
      # 注意：已删除 PET_SERVICE_URL / DOCTOR_SERVICE_URL，
      # 跨服务地址改由 Nacos 服务名 + 实例发现决定，不再使用 compose 固定 DNS
      TZ: Asia/Shanghai
    ports:
      - "${APPOINTMENT_PORT:-8083}:8080"
    networks:
      - petclinic-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

# ---------------------------------------------------------------------
# 共享网络：四个容器加入同一 bridge 网络，
# 服务名 pet-service / doctor-service / mysql 由 Compose 内建 DNS 解析
# ---------------------------------------------------------------------
networks:
  petclinic-net:
    driver: bridge

# ---------------------------------------------------------------------
# 命名数据卷：MySQL 数据落盘位置（容器删除重建数据不丢）
# 注意：这是第 06 周微服务栈的新卷；第 05 周单体的旧卷 petclinic-mysql-data
#      仍保留在本机（其中是单体 petclinic 库的数据），互不影响
# ---------------------------------------------------------------------
volumes:
  mysql-data:
    name: petclinic-ms-mysql-data
  # Nacos 单机模式的数据（Derby + 注册信息）与日志，容器重建后注册配置不丢
  nacos-data:
    name: petclinic-nacos-data
  nacos-logs:
    name: petclinic-nacos-logs
