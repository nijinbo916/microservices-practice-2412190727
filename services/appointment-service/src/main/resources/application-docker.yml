# =====================================================================
# appointment-service docker profile：容器内运行
# 数据库 = 本服务专属的 petclinic_appointment 库（账号 appointment_user）
# 依赖服务地址不再固定：通过 Nacos 服务名发现实例（不再使用 compose DNS 固定地址）
# =====================================================================
spring:
  # ---- Nacos 服务注册与发现（第 07 周）----
  # 地址与凭据全部来自环境变量；分组 PERSONAL_GROUP 为个人项目专用，不与课堂示例混用
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
        namespace: ${NACOS_NAMESPACE:}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
      # ---- 第 08 周：OpenFeign 客户端配置 ----
      # @FeignClient 按 pet.service-name / doctor.service-name 发起调用，
      # 超时不可省：依赖服务卡死不能拖死本服务（连接 3s / 读取 5s）
      openfeign:
        client:
          config:
            default:
              connect-timeout: 3000
              read-timeout: 5000
              logger-level: basic

  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/petclinic_appointment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:appointment_user}
    password: ${DB_PASSWORD:appointment_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

pet:
  service-name: ${PET_SERVICE_NAME:pet-service}
doctor:
  service-name: ${DOCTOR_SERVICE_NAME:doctor-service}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
    com.zjgsu.njb.appointment: info
