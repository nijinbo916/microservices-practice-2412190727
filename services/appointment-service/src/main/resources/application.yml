# =====================================================================
# appointment-service 默认配置（本地开发形态：三个服务都在本机跑）
#
# 跨服务地址：不再写死，改为「服务名 + Nacos 服务发现」
#   pet.service-name / doctor.service-name 由 DiscoveryClient 实时解析实例地址
#   Nacos 地址/凭据/分组见下方 spring.cloud.nacos.discovery（全部可用环境变量覆盖）
# =====================================================================
spring:
  application:
    name: appointment-service

  # ---- 第 10 周：Nacos Config 集中配置 ----
  # Data ID = <服务名>.yaml，Group 区分环境（PETCLINIC_DEV / PETCLINIC_TEST）
  # 实际 import 写在 profile 专属文件里：application-dev.yml / application-docker.yml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---- Nacos 服务注册与发现（第 07 周）----
  # 地址与凭据全部来自环境变量；分组 PERSONAL_GROUP 为个人项目专用，不与课堂示例混用
  cloud:
    nacos:
      # ---- 第 10 周：配置中心（服务端地址与注册中心相同，凭据走环境变量）----
      config:
        # 是否导入由 profile 决定（dev / docker 各自的 application-*.yml 里写 import），
        # 单测（test profile）不连配置中心，所以全局关掉 import 强校验
        import-check:
          enabled: false
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: ${PETCLINIC_CONFIG_GROUP:PETCLINIC_DEV}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
        refresh-enabled: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
        namespace: ${NACOS_NAMESPACE:}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
      # ---- 第 08 周：OpenFeign 客户端配置 ----
      # @FeignClient 按 pet.service-name / doctor.service-name 发起调用，
      # 超时不可省：依赖服务卡死不能拖死本服务（连接 3s / 读取 5s）
      openfeign:
        client:
          config:
            default:
              connect-timeout: 3000
              read-timeout: 5000
              logger-level: basic

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/petclinic_appointment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 依赖服务名（Nacos 中注册的名字）+ 超时（超时不可省：依赖服务卡死不能拖死本服务）
pet:
  service-name: ${PET_SERVICE_NAME:pet-service}
doctor:
  service-name: ${DOCTOR_SERVICE_NAME:doctor-service}

# 容器内监听 8080，宿主机由 compose 映射为 8083
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info

# =====================================================================
# 第 09 周：跨服务调用凭证
# 本服务不签也不验 JWT，只在与同栈服务通信时带上「内部调用」凭证，
# 让对方知道这不是外部直连。值与网关的 trusted-caller 相同。
# =====================================================================
app:
  security:
    trusted-caller: ${TRUSTED_CALLER_SECRET:dev-only-trusted-caller-change-me}
