# ----------------------------------------------------------------------
# test profile：单元测试专用配置（H2 内存数据库）
# 跨服务按服务名寻址，测试用假 DiscoveryClient 解析到 *-stub:8080，
# 再由 MockRestServiceServer 拦截 RestTemplate 请求，不会发起真实网络调用
# ----------------------------------------------------------------------
spring:
  # 单元测试不依赖真实 Nacos：关闭注册与发现，由测试用假 DiscoveryClient 代替
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false

  datasource:
    url: jdbc:h2:mem:appointment-service-test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    show-sql: false

  sql:
    init:
      mode: never

pet:
  service-name: pet-service
doctor:
  service-name: doctor-service

logging:
  level:
    root: warn
