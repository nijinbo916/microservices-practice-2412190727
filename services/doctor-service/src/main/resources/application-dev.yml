# =====================================================================
# dev profile：本地开发环境
#
# 配置来源 = 本地默认值（application.yml）+ Nacos 的 PETCLINIC_DEV 组。
# 单测走 test profile，不会加载本文件，也就不会连配置中心。
# =====================================================================
spring:
  config:
    import: optional:nacos:${spring.application.name}.yaml?group=${PETCLINIC_CONFIG_GROUP:PETCLINIC_DEV}&refreshEnabled=true
