# =====================================================================
# doctor-service 默认配置（本地直连 MySQL 的开发形态）
# =====================================================================
spring:
  application:
    name: doctor-service

  # ---- 第 10 周：Nacos Config 集中配置 ----
  # Data ID = <服务名>.yaml，Group 区分环境（PETCLINIC_DEV / PETCLINIC_TEST）
  # 实际 import 写在 profile 专属文件里：application-dev.yml / application-docker.yml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---- Nacos 服务注册与发现（第 07 周）----
  # 地址与凭据全部来自环境变量；分组 PERSONAL_GROUP 为个人项目专用，不与课堂示例混用
  cloud:
    nacos:
      # ---- 第 10 周：配置中心（服务端地址与注册中心相同，凭据走环境变量）----
      config:
        # 是否导入由 profile 决定（dev / docker 各自的 application-*.yml 里写 import），
        # 单测（test profile）不连配置中心，所以全局关掉 import 强校验
        import-check:
          enabled: false
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: ${PETCLINIC_CONFIG_GROUP:PETCLINIC_DEV}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
        refresh-enabled: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
        namespace: ${NACOS_NAMESPACE:}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/petclinic_doctor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 容器内监听 8080，宿主机由 compose 映射为 8082
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
