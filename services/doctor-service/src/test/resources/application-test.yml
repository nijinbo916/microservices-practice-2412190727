# ----------------------------------------------------------------------
# test profile：单元测试专用配置（H2 内存数据库）
# data.sql（3 名医生）在 Hibernate 建表后自动执行
# ----------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:h2:mem:doctor-service-test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: false

  sql:
    init:
      mode: always

logging:
  level:
    root: warn
