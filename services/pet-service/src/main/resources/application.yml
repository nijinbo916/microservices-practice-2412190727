# =====================================================================
# pet-service 默认配置（本地直连 MySQL 的开发形态）
#
# 容器运行时由 docker profile（application-docker.yml）接管，
# 连接参数均可被环境变量覆盖。
# =====================================================================
spring:
  application:
    name: pet-service

  # ---- Nacos 服务注册与发现（第 07 周）----
  # 地址与凭据全部来自环境变量；分组 PERSONAL_GROUP 为个人项目专用，不与课堂示例混用
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
        namespace: ${NACOS_NAMESPACE:}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/petclinic_pet?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 容器内监听 8080，宿主机由 compose 映射为 8081
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info

# =====================================================================
# 第 09 周 · 认证与网关信任
#   jwt-secret 必须与 gateway-service 的 app.security.jwt-secret 完全一致，
#   否则网关验签全部失败（表现为登录成功但带 token 访问全是 401）。
#   真实值放 .env；这里的默认值只够本地跑通，上线必须替换。
# =====================================================================
app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
    issuer: ${JWT_ISSUER:petclinic-auth}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
    # 测试账号初始密码：仅演示用，README 写着必须替换
    seed-password: ${APP_SEED_PASSWORD:Passw0rd-demo-2026}
    # 与网关 trusted-caller 一致，用来识别「这个请求过了网关」
    trusted-caller: ${TRUSTED_CALLER_SECRET:dev-only-trusted-caller-change-me}
    # 本地用 MockMvc 跑测试时直连控制器，测试配置里会关掉
    trust-enabled: ${GATEWAY_TRUST_ENABLED:true}
