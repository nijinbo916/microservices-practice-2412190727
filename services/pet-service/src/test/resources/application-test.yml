# ----------------------------------------------------------------------
# test profile：单元测试专用配置（H2 内存数据库）
#
# - 不依赖本机 MySQL，任何机器上 ./mvnw test 都能直接跑通
# - ddl-auto=create-drop：每次测试运行重建表结构
# ----------------------------------------------------------------------
spring:
  # 单元测试不依赖真实 Nacos：关闭注册与发现，由测试用假 DiscoveryClient 代替
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false

  datasource:
    url: jdbc:h2:mem:pet-service-test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    show-sql: false

  sql:
    init:
      mode: never

logging:
  level:
    root: warn

# ----------------------------------------------------------------------
# 第 09 周：测试用安全配置
#
# trust-enabled=false：MockMvc 直连控制器，不经过网关，没有 X-Trusted-Caller，
# 开着会让所有 /api/** 测试 401。生产/容器里必须是 true（默认值就是 true）。
# jwt-secret 固定成本地测试串，不依赖环境变量，保证任何机器上都能跑。
# ----------------------------------------------------------------------
app:
  security:
    jwt-secret: test-only-jwt-secret-0123456789-abcdefghij
    issuer: petclinic-auth
    ttl-minutes: 30
    seed-password: Test-Passw0rd-2026
    trusted-caller: test-only-trusted-caller
    trust-enabled: false
